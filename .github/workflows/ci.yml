name: CI

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

    workflow_dispatch:

jobs:
    test-local:
        name: WebDriverIO Tests - Local
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check TypeScript
              run: npx tsc --noEmit

            - name: Run ESLint
              run: npm run lint

            - name: Run WebDriverIO tests
              env:
                  TEST_ENV: local
                  TEST_USER_NAME: ${{ secrets.TEST_USER_NAME }}
                  TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
                  TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
                  TEST_USER_NAME_ALTERNATIVE: ${{ secrets.TEST_USER_NAME_ALTERNATIVE }}
                  TEST_USER_EMAIL_ALTERNATIVE: ${{ secrets.TEST_USER_EMAIL_ALTERNATIVE }}
                  TEST_USER_PASSWORD_ALTERNATIVE: ${{ secrets.TEST_USER_PASSWORD_ALTERNATIVE }}
              run: npm run wdio

            - name: Generate Allure report
              if: always()
              run: npx allure generate allure-results --clean -o allure-report

            - name: Upload Allure report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: allure-report-local
                  path: allure-report/
                  if-no-files-found: warn

            - name: Upload Allure results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: allure-results-local
                  path: allure-results/
                  if-no-files-found: warn

    test-cloud:
        name: WebDriverIO Tests - LambdaTest
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check TypeScript
              run: npx tsc --noEmit

            - name: Run ESLint
              run: npm run lint

            - name: Run WebDriverIO tests on LambdaTest
              env:
                  TEST_ENV: cloud
                  LT_USERNAME: ${{ secrets.LT_USERNAME }}
                  LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
                  TEST_USER_NAME: ${{ secrets.TEST_USER_NAME }}
                  TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
                  TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
                  TEST_USER_NAME_ALTERNATIVE: ${{ secrets.TEST_USER_NAME_ALTERNATIVE }}
                  TEST_USER_EMAIL_ALTERNATIVE: ${{ secrets.TEST_USER_EMAIL_ALTERNATIVE }}
                  TEST_USER_PASSWORD_ALTERNATIVE: ${{ secrets.TEST_USER_PASSWORD_ALTERNATIVE }}
              run: npm run wdio

            - name: Generate Allure report
              if: always()
              run: npx allure generate allure-results --clean -o allure-report

            - name: Upload Allure report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: allure-report-lambdatest
                  path: allure-report/
                  if-no-files-found: warn

            - name: Upload Allure results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: allure-results-lambdatest
                  path: allure-results/
                  if-no-files-found: warn
